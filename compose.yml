services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: x-bot-valkey
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD} --appendonly yes
    ports: 
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped

volumes:
  valkey_data:
